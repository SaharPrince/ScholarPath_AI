name: Live scholarship discovery

on:
  schedule:
    # Recheck official scholarship sources every six hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: scholarpath-live-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run authenticated scholarship discovery
        env:
          CRON_SECRET: ${{ secrets.SCHOLARPATH_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repository secret SCHOLARPATH_CRON_SECRET is missing."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 240 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://scholarpath-ai-six.vercel.app/api/cron/discover"
