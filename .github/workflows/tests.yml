name: ScholarPath tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check browser JavaScript syntax
        run: python scripts/check_frontend_js.py
      - name: Test plain-language requirement summaries
        run: node scripts/test_frontend_requirements.js
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start static app for browser tests
        run: |
          python -m http.server 8000 --directory app/static > /tmp/scholarpath-static.log 2>&1 &
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scholarpath-static.log
          exit 1
      - name: Test requirements panel on desktop and mobile
        run: node scripts/test_frontend_browser.mjs
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

  # External provider checks are manual to avoid repeatedly hitting scholarship sites on every code push.
  live-official-sources:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify live official scholarship sources (read-only)
        run: python scripts/live_source_verification.py
